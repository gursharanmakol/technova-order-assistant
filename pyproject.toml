[project]
name = "mcp-order-assistant-lab"
version = "1.0.0"
description = "TechNova order assistant: a hands-on MCP debugging lab"
requires-python = ">=3.12"
dependencies = [
    "mcp==2.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
